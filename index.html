<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Default title (overridden by React/Helmet on hydration) -->
  <title>Hao Lam | Computer Vision</title>

  <!-- SEO meta tags managed by React/Helmet -->

  <!-- Google Search Console Verification -->
  <meta name="google-site-verification" content="vKzcVvHatyDl5YoQPZzkIHqzbbO03V3zbFxPPfst3KI">

  <!-- Google Discover: Enable large image previews -->
  <meta name="robots" content="max-image-preview:large">

  <!-- Security: Referrer Policy -->
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <!-- Security: Content Security Policy -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https:; connect-src 'self'; base-uri 'self'; form-action 'self';">

  <!-- Preload self-hosted fonts for faster initial render -->
  <link rel="preload" href="/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin
    fetchpriority="high">
  <link rel="preload" href="/fonts/jetbrains-mono-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>

  <!-- Preconnect to external origins for faster resource loading -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
</head>

<body class="bg-zinc-950 text-white antialiased">
  <div id="root">
    <!-- Static Fallback for SEO & slow connections. Replaced by React on hydration. -->
    <header style="padding: 4rem 2rem; text-align: center; max-width: 800px; margin: 0 auto;">
      <h1 style="font-size: 3rem; margin-bottom: 1rem;">Hao Lam</h1>
      <h2 style="font-size: 1.5rem; color: #a1a1aa; margin-bottom: 2rem;">Computer Vision</h2>
      <p style="font-size: 1.25rem; line-height: 1.6; margin-bottom: 2rem;">
        Exploring the frontiers of Computer Vision. Bridging the gap between pixels and perception.
      </p>
      <nav>
        <a href="/" style="color: white; margin: 0 1rem;">Home</a>
        <a href="/projects" style="color: white; margin: 0 1rem;">Projects</a>
        <a href="/thoughts" style="color: white; margin: 0 1rem;">Thoughts</a>
      </nav>
    </header>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
